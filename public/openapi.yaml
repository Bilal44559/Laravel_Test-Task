openapi: 3.0.3
info:
  title: Translation Management Service API
  description: |
    API-driven translation management service supporting multiple locales,
    contextual tags, search, and fast JSON export for frontend applications.
  version: 1.0.0
servers:
  - url: /api
    description: Application API
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token
  schemas:
    Translation:
      type: object
      properties:
        id: { type: integer }
        key: { type: string, example: home.welcome }
        locale: { type: string, example: en }
        content: { type: string, example: Welcome }
        tags:
          type: array
          items: { type: string }
          example: [web, mobile]
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Locale:
      type: object
      properties:
        id: { type: integer }
        code: { type: string, example: en }
        name: { type: string, example: English }
        is_active: { type: boolean }
    Tag:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, example: web }
    ExportResponse:
      type: object
      properties:
        locale: { type: string, example: en }
        translations:
          type: object
          additionalProperties: { type: string }
          example:
            home.welcome: Welcome
            auth.login: Sign in
paths:
  /login:
    post:
      summary: Authenticate and receive API token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                device_name: { type: string }
      responses:
        '200':
          description: Authenticated
        '422':
          description: Invalid credentials
  /logout:
    post:
      summary: Revoke current access token
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Logged out
  /me:
    get:
      summary: Current authenticated user
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: User profile
  /locales:
    get:
      summary: List locales
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Locale list
    post:
      summary: Create locale
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string }
                name: { type: string }
                is_active: { type: boolean }
      responses:
        '201':
          description: Created
  /tags:
    get:
      summary: List tags
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Tag list
    post:
      summary: Create tag
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '201':
          description: Created
  /translations:
    get:
      summary: Search translations by key, content, locale, or tags
      security: [{ BearerAuth: [] }]
      parameters:
        - in: query
          name: key
          schema: { type: string }
        - in: query
          name: content
          schema: { type: string }
        - in: query
          name: locale
          schema: { type: string }
        - in: query
          name: tags[]
          schema:
            type: array
            items: { type: string }
        - in: query
          name: per_page
          schema: { type: integer, maximum: 100 }
      responses:
        '200':
          description: Paginated translations
    post:
      summary: Create or upsert a translation
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, locale, content]
              properties:
                key: { type: string }
                locale: { type: string }
                content: { type: string }
                tags:
                  type: array
                  items: { type: string }
      responses:
        '201':
          description: Created
  /translations/export:
    get:
      summary: Export translations as JSON key-value map for frontend apps
      security: [{ BearerAuth: [] }]
      parameters:
        - in: query
          name: locale
          required: true
          schema: { type: string }
        - in: query
          name: tags[]
          schema:
            type: array
            items: { type: string }
      responses:
        '200':
          description: Export payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportResponse'
  /translations/{translation}:
    get:
      summary: View a translation
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: translation
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Translation
    put:
      summary: Update a translation
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: translation
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                key: { type: string }
                locale: { type: string }
                content: { type: string }
                tags:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: Updated
    delete:
      summary: Delete a translation
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: translation
          required: true
          schema: { type: integer }
      responses:
        '204':
          description: Deleted
